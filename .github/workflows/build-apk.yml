name: Build Pooleyar APK

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Android versionCode (must be higher than the installed version)"
        required: true
        default: "2"
      versionName:
        description: "Human-readable version name"
        required: true
        default: "1.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 GitHub secret."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PversionCode=${{ inputs.versionCode }} \
            -PversionName=${{ inputs.versionName }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pooleyar-${{ inputs.versionName }}-${{ inputs.versionCode }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
